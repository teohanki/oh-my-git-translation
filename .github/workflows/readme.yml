name: Readme

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Edit
        run: |
          python3 tools/readme_fix.py
          rm tools/readme_fix.py
          git config user.name "teohanki"
          git config user.email "teohanki@users.noreply.github.com"
          git add -A
          git commit -m "Add macOS first launch note to the README"
          git push
