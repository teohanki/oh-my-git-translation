name: Unpack

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Unpack
        run: |
          unzip -q oh-my-git-translation-files.zip -d unpacked
          rm oh-my-git-translation-files.zip README.md
          cp -a unpacked/oh-my-git-translation/. .
          rm -rf unpacked
          git config user.name "Teo Hanki"
          git config user.email "345032692+teohanki@users.noreply.github.com"
          git add -A
          git commit -q -m "Unpack translation files"
          git push
